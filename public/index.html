<!DOCTYPE html>
<html>
<head>
  <title>Todo App - Priority Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #333; margin-bottom: 30px; }
    
    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card .number { font-size: 32px; font-weight: bold; }
    .stat-card .label { font-size: 12px; margin-top: 5px; opacity: 0.9; }
    
    /* Priority Chart */
    .priority-chart {
      background: #f7f7f7;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .priority-bar {
      margin: 10px 0;
      display: flex;
      align-items: center;
    }
    .priority-label { width: 80px; font-weight: bold; }
    .bar-container {
      flex: 1;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 10px;
    }
    .bar {
      height: 30px;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      color: white;
      font-size: 12px;
    }
    
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    input, select, button {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { flex: 2; }
    select { flex: 1; }
    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #5a67d8; }
    
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #e0e0e0;
      color: #333;
      padding: 8px 16px;
    }
    .filter-btn.active { background: #667eea; color: white; }
    
    .stats {
      text-align: center;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #667eea;
    }
    .task-list { list-style: none; }
    .task-item {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 5px solid;
    }
    .task-item.priority-urgent { border-left-color: #f56565; }
    .task-item.priority-high { border-left-color: #ed8936; }
    .task-item.priority-medium { border-left-color: #ecc94b; }
    .task-item.priority-low { border-left-color: #48bb78; }
    .task-content { flex: 1; }
    .task-title { font-size: 16px; margin-bottom: 5px; }
    .task-title.completed { text-decoration: line-through; color: #888; }
    .priority-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin-left: 10px;
    }
    .priority-urgent { background: #f56565; color: white; }
    .priority-high { background: #ed8936; color: white; }
    .priority-medium { background: #ecc94b; }
    .priority-low { background: #48bb78; color: white; }
    .task-date { font-size: 12px; color: #999; }
    .task-actions { display: flex; gap: 8px; }
    .task-actions button { padding: 6px 12px; font-size: 14px; }
    .edit-btn { background: #48bb78; }
    .toggle-btn { background: #4299e1; }
    .delete-btn { background: #f56565; }
  </style>
</head>
<body>
<div class="container">
  <h1>📊 Priority Todo Dashboard</h1>
  
  <div class="dashboard" id="dashboard">
    <div class="stat-card"><div class="number" id="totalTasks">0</div><div class="label">Total Tasks</div></div>
    <div class="stat-card"><div class="number" id="completedTasks">0</div><div class="label">Completed</div></div>
    <div class="stat-card"><div class="number" id="pendingTasks">0</div><div class="label">Pending</div></div>
    <div class="stat-card"><div class="number" id="completionRate">0%</div><div class="label">Completion Rate</div></div>
  </div>
  
  <div class="priority-chart"><h3>Priority Distribution</h3><div id="priorityBars"></div></div>
  
  <div class="input-section">
    <input id="taskInput" placeholder="Enter a task..." onkeypress="handleKeyPress(event)">
    <select id="prioritySelect">
      <option value="low">🟢 Low Priority</option>
      <option value="medium" selected>🟡 Medium Priority</option>
      <option value="high">🟠 High Priority</option>
      <option value="urgent">🔴 Urgent</option>
    </select>
    <button onclick="addTask()">Add Task</button>
  </div>
  
  <div class="filters">
    <button class="filter-btn active" onclick="filterTasks('all')">All</button>
    <button class="filter-btn" onclick="filterTasks('urgent')">Urgent</button>
    <button class="filter-btn" onclick="filterTasks('high')">High</button>
    <button class="filter-btn" onclick="filterTasks('medium')">Medium</button>
    <button class="filter-btn" onclick="filterTasks('low')">Low</button>
    <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
    <button class="filter-btn" onclick="filterTasks('pending')">Pending</button>
  </div>
  
  <div class="stats" id="stats"></div>
  <ul class="task-list" id="taskList"></ul>
</div>

<script>
let allTasks = [];
let currentFilter = 'all';

async function loadDashboard() {
  const res = await fetch("/dashboard/stats");
  const stats = await res.json();
  document.getElementById("totalTasks").textContent = stats.totalTasks;
  document.getElementById("completedTasks").textContent = stats.completedTasks;
  document.getElementById("pendingTasks").textContent = stats.pendingTasks;
  document.getElementById("completionRate").textContent = `${stats.completionRate}%`;
  
  const priorityBars = document.getElementById("priorityBars");
  const colors = { urgent: '#f56565', high: '#ed8936', medium: '#ecc94b', low: '#48bb78' };
  priorityBars.innerHTML = '';
  for (const p of ['urgent', 'high', 'medium', 'low']) {
    const stat = stats.priorityStats.find(s => s._id === p);
    const count = stat ? stat.count : 0;
    const percent = stats.totalTasks > 0 ? (count / stats.totalTasks * 100).toFixed(1) : 0;
    priorityBars.innerHTML += `
      <div class="priority-bar">
        <div class="priority-label">${p.toUpperCase()}</div>
        <div class="bar-container"><div class="bar" style="width: ${percent}%; background: ${colors[p]}">${count}</div></div>
      </div>`;
  }
}

async function addTask() {
  const title = document.getElementById("taskInput").value;
  const priority = document.getElementById("prioritySelect").value;
  if (!title.trim()) return alert("Enter a task!");
  await fetch("/add", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title, priority }) });
  document.getElementById("taskInput").value = "";
  loadTasks(); loadDashboard();
}

async function deleteTask(id) {
  if (confirm("Delete?")) { await fetch(`/delete/${id}`, { method: "DELETE" }); loadTasks(); loadDashboard(); }
}

async function toggleTask(id) {
  await fetch(`/toggle/${id}`, { method: "PUT" });
  loadTasks(); loadDashboard();
}

async function editTask(id, title) {
  const newTitle = prompt("Edit task:", title);
  if (newTitle && newTitle.trim()) {
    await fetch(`/edit/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: newTitle }) });
    loadTasks(); loadDashboard();
  }
}

function handleKeyPress(e) { if (e.key === "Enter") addTask(); }

function filterTasks(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  let filtered = [...allTasks];
  if (filter === 'urgent') filtered = allTasks.filter(t => t.priority === 'urgent');
  else if (filter === 'high') filtered = allTasks.filter(t => t.priority === 'high');
  else if (filter === 'medium') filtered = allTasks.filter(t => t.priority === 'medium');
  else if (filter === 'low') filtered = allTasks.filter(t => t.priority === 'low');
  else if (filter === 'completed') filtered = allTasks.filter(t => t.completed);
  else if (filter === 'pending') filtered = allTasks.filter(t => !t.completed);
  displayTasks(filtered);
}

function displayTasks(tasks) {
  const taskList = document.getElementById("taskList");
  if (tasks.length === 0) { taskList.innerHTML = '<div class="empty-message">✨ No tasks</div>'; return; }
  let completed = 0;
  const priorityNames = { urgent: 'URGENT', high: 'HIGH', medium: 'MEDIUM', low: 'LOW' };
  taskList.innerHTML = tasks.map(task => {
    if (task.completed) completed++;
    return `<li class="task-item priority-${task.priority}">
      <div class="task-content">
        <div class="task-title ${task.completed ? 'completed' : ''}">
          ${escapeHtml(task.title)} <span class="priority-badge priority-${task.priority}">${priorityNames[task.priority]}</span>
        </div>
        <div class="task-date">📅 ${new Date(task.createdAt).toLocaleString()}</div>
      </div>
      <div class="task-actions">
        <button class="edit-btn" onclick="editTask('${task._id}', '${escapeHtml(task.title)}')">Edit</button>
        <button class="toggle-btn" onclick="toggleTask('${task._id}')">${task.completed ? 'Undo' : 'Complete'}</button>
        <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
      </div>
    </li>`;
  }).join('');
  document.getElementById("stats").innerHTML = `📊 ${completed}/${tasks.length} completed (${Math.round(completed/tasks.length*100)}%)`;
}

async function loadTasks() {
  const res = await fetch("/tasks");
  allTasks = await res.json();
  filterTasks(currentFilter);
}

function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

loadTasks(); loadDashboard();
</script>
</body>
</html>
