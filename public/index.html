<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    .stats {
      text-align: center;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #667eea;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-radius: 8px;
      transition: transform 0.2s;
    }

    .task-item:hover {
      transform: translateX(5px);
      background: #f0f0f0;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: #888;
    }

    .task-date {
      font-size: 12px;
      color: #999;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .task-actions button {
      padding: 6px 12px;
      font-size: 14px;
    }

    .edit-btn {
      background: #48bb78;
    }

    .edit-btn:hover {
      background: #38a169;
    }

    .toggle-btn {
      background: #4299e1;
    }

    .toggle-btn:hover {
      background: #3182ce;
    }

    .delete-btn {
      background: #f56565;
    }

    .delete-btn:hover {
      background: #e53e3e;
    }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 18px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item {
      animation: fadeIn 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 MongoDB Todo App</h1>
    
    <div class="input-section">
      <input id="taskInput" placeholder="Enter a new task..." onkeypress="handleKeyPress(event)">
      <button onclick="addTask()">Add Task</button>
    </div>

    <div class="stats" id="stats"></div>

    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    async function addTask() {
      const title = document.getElementById("taskInput").value;
      
      if (!title.trim()) {
        alert("Please enter a task!");
        return;
      }

      try {
        const response = await fetch("/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title })
        });

        if (response.ok) {
          document.getElementById("taskInput").value = "";
          loadTasks();
        } else {
          alert("Error adding task");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Error adding task");
      }
    }

    async function deleteTask(id) {
      if (confirm("Are you sure you want to delete this task?")) {
        try {
          await fetch(`/delete/${id}`, { method: "DELETE" });
          loadTasks();
        } catch (error) {
          console.error("Error:", error);
          alert("Error deleting task");
        }
      }
    }

    async function toggleTask(id) {
      try {
        await fetch(`/toggle/${id}`, { method: "PUT" });
        loadTasks();
      } catch (error) {
        console.error("Error:", error);
        alert("Error toggling task");
      }
    }

    async function editTask(id, currentTitle) {
      const newTitle = prompt("Edit task:", currentTitle);
      
      if (newTitle && newTitle.trim()) {
        try {
          await fetch(`/edit/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: newTitle })
          });
          loadTasks();
        } catch (error) {
          console.error("Error:", error);
          alert("Error editing task");
        }
      }
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        addTask();
      }
    }

    async function loadTasks() {
      try {
        const response = await fetch("/tasks");
        const tasks = await response.json();
        
        const taskList = document.getElementById("taskList");
        const statsDiv = document.getElementById("stats");
        
        if (tasks.length === 0) {
          taskList.innerHTML = '<div class="empty-message">✨ No tasks yet. Add your first task above! ✨</div>';
          statsDiv.innerHTML = "📊 0/0 tasks completed";
          return;
        }
        
        let completedCount = 0;
        
        taskList.innerHTML = tasks.map(task => {
          if (task.completed) completedCount++;
          
          return `
            <li class="task-item">
              <div class="task-content">
                <div class="task-title ${task.completed ? 'completed' : ''}">
                  ${escapeHtml(task.title)}
                </div>
                <div class="task-date">
                  📅 Created: ${new Date(task.createdAt).toLocaleString()}
                </div>
              </div>
              <div class="task-actions">
                <button class="edit-btn" onclick="editTask('${task._id}', '${escapeHtml(task.title)}')">✏️ Edit</button>
                <button class="toggle-btn" onclick="toggleTask('${task._id}')">
                  ${task.completed ? '↺ Undo' : '✓ Complete'}
                </button>
                <button class="delete-btn" onclick="deleteTask('${task._id}')">🗑️ Delete</button>
              </div>
            </li>
          `;
        }).join('');
        
        const percentage = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 0;
        statsDiv.innerHTML = `📊 ${completedCount}/${tasks.length} tasks completed (${percentage}%)`;
        
      } catch (error) {
        console.error("Error loading tasks:", error);
        document.getElementById("taskList").innerHTML = '<div class="empty-message">❌ Error loading tasks. Make sure the server is running!</div>';
      }
    }

    // Helper function to escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load tasks when page loads
    loadTasks();
    
    // Auto-refresh tasks every 5 seconds (optional)
    // setInterval(loadTasks, 5000);
  </script>
</body>
</html>
