<!DOCTYPE html>
<html>
<head>
  <title>Todo App - Complete (with Categories & Dark Mode)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }
    h1 { text-align: center; margin-bottom: 20px; }
    
    /* Dark Mode Toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
    }
    
    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: flex-end;
    }
    .action-btn {
      background: #48bb78;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .action-btn.import { background: #4299e1; }
    
    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card .number { font-size: 28px; font-weight: bold; }
    .stat-card .label { font-size: 12px; opacity: 0.9; }
    
    /* Priority Chart */
    .priority-chart {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .priority-bar {
      margin: 8px 0;
      display: flex;
      align-items: center;
    }
    .priority-label { width: 70px; font-weight: bold; }
    .bar-container {
      flex: 1;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 10px;
    }
    .bar {
      height: 25px;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      color: white;
      font-size: 11px;
    }
    
    /* Alert Banner */
    .alert-banner {
      background: #fef5e7;
      border-left: 4px solid #f39c12;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      display: none;
    }
    .alert-banner.show { display: block; }
    
    /* Search Section */
    .search-section {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .search-box { display: flex; gap: 10px; margin-bottom: 10px; }
    .search-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-group select { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
    
    /* Input Section */
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    input, select, button {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    input { flex: 2; min-width: 150px; }
    select { flex: 1; min-width: 100px; }
    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #5a67d8; }
    
    /* Filter Sections */
    .filters-section {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .priority-filters, .category-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn, .cat-btn {
      background: #e0e0e0;
      color: #333;
      padding: 6px 12px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
    }
    .filter-btn.active, .cat-btn.active {
      background: #667eea;
      color: white;
    }
    
    /* Category Badges */
    .category-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin-left: 10px;
      color: white;
    }
    .category-work { background: #4299e1; }
    .category-personal { background: #48bb78; }
    .category-shopping { background: #ed8936; }
    .category-study { background: #9f7aea; }
    .category-health { background: #f56565; }
    .category-other { background: #a0aec0; }
    
    /* Tags */
    .tags { font-size: 11px; margin-top: 3px; }
    .tag {
      display: inline-block;
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 10px;
      margin-right: 5px;
    }
    
    .stats {
      text-align: center;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .task-list { list-style: none; }
    .task-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f9f9f9;
      margin-bottom: 8px;
      border-radius: 8px;
      border-left: 4px solid;
    }
    .task-item.priority-urgent { border-left-color: #f56565; }
    .task-item.priority-high { border-left-color: #ed8936; }
    .task-item.priority-medium { border-left-color: #ecc94b; }
    .task-item.priority-low { border-left-color: #48bb78; }
    .task-item.overdue { background: #fff5f5; }
    .task-item.due-today { background: #fffaf0; }
    .task-content { flex: 1; }
    .task-title { font-size: 15px; margin-bottom: 5px; }
    .task-title.completed { text-decoration: line-through; color: #888; }
    .priority-badge, .due-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      margin-left: 8px;
      color: white;
    }
    .priority-urgent { background: #f56565; }
    .priority-high { background: #ed8936; }
    .priority-medium { background: #ecc94b; color: #333; }
    .priority-low { background: #48bb78; }
    .overdue-badge { background: #f56565; }
    .today-badge { background: #f39c12; }
    .task-date { font-size: 10px; color: #999; margin-top: 3px; }
    .task-actions { display: flex; gap: 5px; }
    .task-actions button { padding: 4px 8px; font-size: 11px; }
    .edit-btn { background: #48bb78; }
    .toggle-btn { background: #4299e1; }
    .delete-btn { background: #f56565; }
    
    /* Dark Mode */
    body.dark-mode { background: #1a1a1a; }
    body.dark-mode .container { background: #2d2d2d; }
    body.dark-mode h1 { color: #fff; }
    body.dark-mode .input-section input, body.dark-mode .input-section select,
    body.dark-mode .search-section input, body.dark-mode .search-section select {
      background: #3d3d3d; color: #fff; border-color: #4d4d4d;
    }
    body.dark-mode .stats, body.dark-mode .priority-chart { background: #3d3d3d; color: #fff; }
    body.dark-mode .task-item { background: #3d3d3d; }
    body.dark-mode .task-title { color: #fff; }
    body.dark-mode .task-date { color: #aaa; }
    body.dark-mode .tag { background: #4d4d4d; color: #fff; }
    body.dark-mode .filter-btn, body.dark-mode .cat-btn {
      background: #4d4d4d; color: #fff;
    }
    body.dark-mode .filter-btn.active, body.dark-mode .cat-btn.active {
      background: #667eea;
    }
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>

<div class="container">
  <h1>📊 Complete Todo App</h1>
  
  <!-- Export/Import Buttons -->
  <div class="action-buttons">
    <button class="action-btn" onclick="exportTasks()">📤 Export Tasks</button>
    <button class="action-btn import" onclick="importTasks()">📥 Import Tasks</button>
  </div>
  
  <!-- Dashboard -->
  <div class="dashboard">
    <div class="stat-card"><div class="number" id="totalTasks">0</div><div class="label">Total Tasks</div></div>
    <div class="stat-card"><div class="number" id="completedTasks">0</div><div class="label">Completed</div></div>
    <div class="stat-card"><div class="number" id="pendingTasks">0</div><div class="label">Pending</div></div>
    <div class="stat-card"><div class="number" id="completionRate">0%</div><div class="label">Completion Rate</div></div>
  </div>
  
  <!-- Priority Chart -->
  <div class="priority-chart"><h3>Priority Distribution</h3><div id="priorityBars"></div></div>
  
  <!-- Alert Banner -->
  <div class="alert-banner" id="alertBanner"></div>
  
  <!-- Search Section -->
  <div class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search tasks..." onkeyup="searchTasks()">
      <button onclick="searchTasks()">🔍 Search</button>
    </div>
    <div class="filter-group">
      <select id="statusFilter" onchange="searchTasks()">
        <option value="">All Status</option><option value="pending">Pending</option><option value="completed">Completed</option>
      </select>
      <select id="dueFilter" onchange="searchTasks()">
        <option value="">All Due Dates</option><option value="today">Due Today</option><option value="overdue">Overdue</option>
      </select>
    </div>
  </div>
  
  <!-- Add Task Form -->
  <div class="input-section">
    <input id="taskInput" placeholder="Enter a task..." onkeypress="handleKeyPress(event)">
    <select id="prioritySelect">
      <option value="low">🟢 Low</option><option value="medium" selected>🟡 Medium</option>
      <option value="high">🟠 High</option><option value="urgent">🔴 Urgent</option>
    </select>
    <input type="date" id="dueDateInput" placeholder="Due date">
    <select id="categorySelect">
      <option value="work">💼 Work</option><option value="personal">👤 Personal</option>
      <option value="shopping">🛒 Shopping</option><option value="study">📚 Study</option>
      <option value="health">🏥 Health</option><option value="other" selected>📝 Other</option>
    </select>
    <input id="tagsInput" placeholder="Tags (comma separated)">
    <button onclick="addTask()">Add Task</button>
  </div>
  
  <!-- Filter Buttons -->
  <div class="filters-section">
    <div class="priority-filters">
      <button class="filter-btn active" onclick="filterByPriority('all', this)">All</button>
      <button class="filter-btn" onclick="filterByPriority('urgent', this)">Urgent</button>
      <button class="filter-btn" onclick="filterByPriority('high', this)">High</button>
      <button class="filter-btn" onclick="filterByPriority('medium', this)">Medium</button>
      <button class="filter-btn" onclick="filterByPriority('low', this)">Low</button>
      <button class="filter-btn" onclick="filterByPriority('completed', this)">Completed</button>
      <button class="filter-btn" onclick="filterByPriority('pending', this)">Pending</button>
    </div>
    <div class="category-filters">
      <button class="cat-btn active" onclick="filterByCategory('all', this)">📋 All</button>
      <button class="cat-btn" onclick="filterByCategory('work', this)">💼 Work</button>
      <button class="cat-btn" onclick="filterByCategory('personal', this)">👤 Personal</button>
      <button class="cat-btn" onclick="filterByCategory('shopping', this)">🛒 Shopping</button>
      <button class="cat-btn" onclick="filterByCategory('study', this)">📚 Study</button>
      <button class="cat-btn" onclick="filterByCategory('health', this)">🏥 Health</button>
      <button class="cat-btn" onclick="filterByCategory('other', this)">📝 Other</button>
    </div>
  </div>
  
  <div class="stats" id="stats"></div>
  <ul class="task-list" id="taskList"></ul>
</div>

<script>
let allTasks = [];
let currentPriorityFilter = 'all';
let currentCategoryFilter = 'all';

// ========== DARK MODE ==========
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  const btn = document.querySelector('.theme-toggle');
  if (document.body.classList.contains('dark-mode')) {
    btn.textContent = '☀️';
    localStorage.setItem('darkMode', 'enabled');
  } else {
    btn.textContent = '🌙';
    localStorage.setItem('darkMode', 'disabled');
  }
}

function checkDarkMode() {
  if (localStorage.getItem('darkMode') === 'enabled') {
    document.body.classList.add('dark-mode');
    document.querySelector('.theme-toggle').textContent = '☀️';
  }
}

// ========== EXPORT/IMPORT ==========
async function exportTasks() {
  const res = await fetch("/export");
  const tasks = await res.json();
  const link = document.createElement('a');
  link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(tasks, null, 2));
  link.download = `todo_tasks_${new Date().toISOString().slice(0,19)}.json`;
  link.click();
  alert(`Exported ${tasks.length} tasks!`);
}

async function importTasks() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async (event) => {
      const tasks = JSON.parse(event.target.result);
      await fetch("/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(tasks) });
      alert(`Imported ${tasks.length} tasks!`);
      loadTasks();
      loadDashboard();
    };
    reader.readAsText(file);
  };
  input.click();
}

// ========== DASHBOARD ==========
async function loadDashboard() {
  try {
    const res = await fetch("/dashboard/stats");
    const stats = await res.json();
    document.getElementById("totalTasks").textContent = stats.totalTasks;
    document.getElementById("completedTasks").textContent = stats.completedTasks;
    document.getElementById("pendingTasks").textContent = stats.pendingTasks;
    document.getElementById("completionRate").textContent = `${stats.completionRate}%`;
    
    const priorityBars = document.getElementById("priorityBars");
    const colors = { urgent: '#f56565', high: '#ed8936', medium: '#ecc94b', low: '#48bb78' };
    priorityBars.innerHTML = '';
    for (const p of ['urgent', 'high', 'medium', 'low']) {
      const stat = stats.priorityStats.find(s => s._id === p);
      const count = stat ? stat.count : 0;
      const percent = stats.totalTasks > 0 ? (count / stats.totalTasks * 100).toFixed(1) : 0;
      priorityBars.innerHTML += `<div class="priority-bar"><div class="priority-label">${p.toUpperCase()}</div><div class="bar-container"><div class="bar" style="width: ${percent}%; background: ${colors[p]}">${count}</div></div></div>`;
    }
  } catch (err) { console.error(err); }
}

// ========== OVERDUE ALERT ==========
async function checkOverdueTasks() {
  try {
    const res = await fetch("/tasks/overdue");
    const overdue = await res.json();
    if (overdue.length > 0) {
      const banner = document.getElementById("alertBanner");
      banner.innerHTML = `⚠️ You have ${overdue.length} overdue task(s)!`;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 5000);
    }
  } catch (err) {}
}

// ========== ADD TASK ==========
async function addTask() {
  const title = document.getElementById("taskInput").value;
  const priority = document.getElementById("prioritySelect").value;
  const dueDate = document.getElementById("dueDateInput").value;
  const category = document.getElementById("categorySelect").value;
  const tagsInput = document.getElementById("tagsInput").value;
  const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
  
  if (!title.trim()) return alert("Enter a task!");
  
  await fetch("/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, priority, dueDate, category, tags })
  });
  
  document.getElementById("taskInput").value = "";
  document.getElementById("dueDateInput").value = "";
  document.getElementById("tagsInput").value = "";
  loadTasks();
  loadDashboard();
}

// ========== DELETE, TOGGLE, EDIT ==========
async function deleteTask(id) {
  if (confirm("Delete?")) {
    await fetch(`/delete/${id}`, { method: "DELETE" });
    loadTasks();
    loadDashboard();
  }
}

async function toggleTask(id) {
  await fetch(`/toggle/${id}`, { method: "PUT" });
  loadTasks();
  loadDashboard();
}

async function editTask(id, title, priority, dueDate, category, tagsArr) {
  const newTitle = prompt("Edit task:", title);
  const newPriority = prompt("Priority (low/medium/high/urgent):", priority);
  const newDueDate = prompt("Due date (YYYY-MM-DD):", dueDate?.split('T')[0] || '');
  const newCategory = prompt("Category (work/personal/shopping/study/health/other):", category);
  const newTags = prompt("Tags (comma separated):", tagsArr.join(', '));
  
  if (newTitle && newTitle.trim()) {
    await fetch(`/edit/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: newTitle,
        priority: newPriority || 'medium',
        dueDate: newDueDate || null,
        category: newCategory || 'other',
        tags: newTags ? newTags.split(',').map(t => t.trim()) : []
      })
    });
    loadTasks();
    loadDashboard();
  }
}

function handleKeyPress(e) { if (e.key === "Enter") addTask(); }

// ========== SEARCH ==========
async function searchTasks() {
  const q = document.getElementById("searchInput").value;
  const status = document.getElementById("statusFilter").value;
  const due = document.getElementById("dueFilter").value;
  const res = await fetch(`/tasks/search?q=${encodeURIComponent(q)}&status=${status}&due=${due}`);
  const tasks = await res.json();
  displayTasks(tasks);
}

// ========== FILTERS ==========
function filterByPriority(filter, btn) {
  currentPriorityFilter = filter;
  document.querySelectorAll('.priority-filters .filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilters();
}

function filterByCategory(filter, btn) {
  currentCategoryFilter = filter;
  document.querySelectorAll('.category-filters .cat-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  let filtered = [...allTasks];
  
  if (currentPriorityFilter !== 'all') {
    if (currentPriorityFilter === 'completed') filtered = filtered.filter(t => t.completed === true);
    else if (currentPriorityFilter === 'pending') filtered = filtered.filter(t => t.completed === false);
    else filtered = filtered.filter(t => t.priority === currentPriorityFilter);
  }
  
  if (currentCategoryFilter !== 'all') {
    filtered = filtered.filter(t => t.category === currentCategoryFilter);
  }
  
  displayTasks(filtered);
}

// ========== DISPLAY TASKS ==========
function displayTasks(tasks) {
  const taskList = document.getElementById("taskList");
  const statsDiv = document.getElementById("stats");
  
  if (tasks.length === 0) {
    taskList.innerHTML = '<div style="text-align:center;padding:40px;">✨ No tasks found</div>';
    statsDiv.innerHTML = "📊 0/0 tasks completed";
    return;
  }
  
  let completed = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  
  const priorityNames = { urgent: 'URGENT', high: 'HIGH', medium: 'MEDIUM', low: 'LOW' };
  const categoryIcons = { work: '💼', personal: '👤', shopping: '🛒', study: '📚', health: '🏥', other: '📝' };
  
  taskList.innerHTML = tasks.map(task => {
    if (task.completed) completed++;
    
    const isOverdue = task.dueDate && new Date(task.dueDate) < today && !task.completed;
    const isDueToday = task.dueDate && new Date(task.dueDate).toDateString() === today.toDateString() && !task.completed;
    let dueBadge = '';
    if (isOverdue) dueBadge = '<span class="due-badge overdue-badge">OVERDUE</span>';
    else if (isDueToday) dueBadge = '<span class="due-badge today-badge">DUE TODAY</span>';
    
    let dueClass = '';
    if (isOverdue) dueClass = 'overdue';
    else if (isDueToday) dueClass = 'due-today';
    
    return `<li class="task-item priority-${task.priority} ${dueClass}">
      <div class="task-content">
        <div class="task-title ${task.completed ? 'completed' : ''}">
          ${escapeHtml(task.title)}
          <span class="priority-badge priority-${task.priority}">${priorityNames[task.priority]}</span>
          <span class="category-badge category-${task.category}">${categoryIcons[task.category]} ${task.category}</span>
          ${dueBadge}
        </div>
        ${task.tags && task.tags.length > 0 ? `<div class="tags">🏷️ ${task.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="task-date">
          📅 Created: ${new Date(task.createdAt).toLocaleString()}
          ${task.dueDate ? ` | ⏰ Due: ${new Date(task.dueDate).toLocaleDateString()}` : ''}
          ${task.completedAt ? ` | ✅ Completed: ${new Date(task.completedAt).toLocaleString()}` : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="edit-btn" onclick="editTask('${task._id}', '${escapeHtml(task.title)}', '${task.priority}', '${task.dueDate}', '${task.category}', ${JSON.stringify(task.tags || [])})">Edit</button>
        <button class="toggle-btn" onclick="toggleTask('${task._id}')">${task.completed ? 'Undo' : 'Complete'}</button>
        <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
      </div>
    </li>`;
  }).join('');
  
  const percent = tasks.length > 0 ? Math.round(completed / tasks.length * 100) : 0;
  statsDiv.innerHTML = `📊 ${completed}/${tasks.length} completed (${percent}%)`;
}

// ========== LOAD TASKS ==========
async function loadTasks() {
  try {
    const res = await fetch("/tasks");
    allTasks = await res.json();
    applyFilters();
    checkOverdueTasks();
  } catch (err) {
    document.getElementById("taskList").innerHTML = '<div style="text-align:center;padding:40px;">❌ Error loading tasks</div>';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== INITIALIZE ==========
checkDarkMode();
loadTasks();
loadDashboard();
setInterval(checkOverdueTasks, 60000);
</script>
</body>
</html>
